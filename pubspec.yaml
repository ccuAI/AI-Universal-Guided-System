name: projectfront
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.0-227.0.dev

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.1

  # 第三方登入與認證
  google_sign_in: ^6.2.1
  flutter_facebook_auth: ^6.1.0
  flutter_line_sdk: ^3.0.0

  # 網頁與實用工具
  cupertino_icons: ^2.0.0
  webview_flutter: ^4.14.1
  image_picker: ^1.2.3
  http: ^1.6.0
  flutter_inappwebview: ^6.1.3
  flutter_dotenv: ^5.2.0
  webfeed_revised: ^0.9.0
  shared_preferences: ^2.5.6
  change_app_package_name: ^1.5.0
  html: ^0.15.7

  # AI 語音與朗讀
  audioplayers: ^6.8.1
  flutter_tts: ^4.2.5

  # 用藥資料與本機資料庫
  sqflite: ^2.4.2
  path: ^1.9.1
  path_provider: ^2.1.6

  # 服藥通知與時區
  flutter_local_notifications: ^22.3.1
  timezone: ^0.11.1
  flutter_timezone: ^5.0.1

  # 藥單 QR Code 掃描
  mobile_scanner: ^7.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  image: ^4.5.4

flutter:
  uses-material-design: true

  assets:
    - "web/icons/779240515145235692.png"
    - "web/icons/google.png"
    - "web/icons/Line.png"
    - "web/icons/Facebook.png"
    - ".env"
    - "web/icons/37810-removebg-preview.png"
    - "web/icons/37812-removebg-preview.png"
    - "web/icons/37821-removebg-preview.png"
    - "web/icons/KinecTap2.png"