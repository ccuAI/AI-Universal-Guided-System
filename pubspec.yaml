name: projectfront
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.0-227.0.dev

dependencies:
  # 藥袋影像處理與中文 OCR
  image: ^4.5.4
  google_mlkit_text_recognition: ^0.17.1

  # 用藥資料與照片保存
  sqflite: ^2.4.2
  shared_preferences: ^2.5.3
  path: ^1.9.1
  path_provider: ^2.1.5

  # 用藥通知與時區
  flutter_local_notifications: ^22.3.1
  timezone: ^0.11.1
  flutter_timezone: ^5.0.1
  flutter:
    sdk: flutter
  
  # Firebase 相關套件
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  
  # 第三方登入與認證
  google_sign_in: ^7.2.0
  flutter_facebook_auth: ^7.0.0
  flutter_line_sdk: ^3.0.0 
  
  # 實用工具套件
  cupertino_icons: ^2.0.0
  webview_flutter: ^4.14.1
  image_picker: ^1.2.3
  http: ^1.2.0
  flutter_inappwebview: ^6.1.3 # 引入 Flutter InAppWebView 套件
  flutter_dotenv: ^5.2.0 # 引入 Flutter dotenv 套件
  
  # RSS 解析（若因 Null Safety 報錯，請替換為 webfeed_revived）
  webfeed_revised: ^0.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  # 將程式碼檢查工具移至開發依賴
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - "web/icons/779240515145235692.png"
    - "web/icons/google.png"
    - "web/icons/Line.png"
    - "web/icons/Facebook.png"
    - .env
